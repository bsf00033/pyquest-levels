<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PyQuest — Levels</title>
<style>
  :root {
    --cave: #0d1117; --panel: #161b22; --gold: #f0c14b; --fog: #c9d1d9; --fog-dim: #8b949e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, sans-serif;
    background: radial-gradient(ellipse 80% 50% at 50% -10%, #2a1f0a 0%, transparent 55%), var(--cave);
    color: var(--fog); padding: 2rem 1.25rem;
  }
  main { max-width: 420px; margin: 0 auto; }
  h1 { color: var(--gold); font-size: 1.75rem; margin: 0 0 .35rem; }
  p { color: var(--fog-dim); line-height: 1.5; }
  a.level {
    display: block; margin: 1rem 0; padding: 1.1rem 1.25rem; border-radius: 14px;
    background: var(--panel); border: 1px solid #2d3a4f; color: var(--fog);
    text-decoration: none; font-size: 1.1rem; font-weight: 600;
  }
  a.level:active, a.level:hover { border-color: var(--gold); }
  a.level span { display: block; font-weight: 400; font-size: .9rem; color: var(--fog-dim); margin-top: .35rem; }
</style>
</head>
<body>
<main>
  <h1>⚔️ PyQuest</h1>
  <p>Tap a level to play. Needs internet the first time so Python can load.</p>
  <a class="level" href="level-01-treasure-chest.html">Level 1 — Treasure Chest<span>Variables &amp; print</span></a>
  <a class="level" href="level-02-potion-lab.html">Level 2 — Potion Lab<span>Numbers &amp; math</span></a>
</main>
</body>
</html>
