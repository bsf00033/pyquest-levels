<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Aquafin, a water companion">
  <defs>
    <radialGradient id="aq-glow" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity=".5"/>
      <stop offset="55%" stop-color="#0284c7" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aq-body" x1="25%" y1="8%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="aq-belly" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="aq-fin" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="aq-tail" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="55%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <circle cx="128" cy="128" r="118" fill="url(#aq-glow)"/>
  <ellipse cx="128" cy="216" rx="64" ry="12" fill="#082018" opacity=".3"/>

  <!-- Tail fin -->
  <path d="M164 168 C196 150 214 168 228 148 C236 176 220 196 196 198 C220 206 210 228 186 216 C170 208 164 190 164 176 Z"
        fill="url(#aq-tail)" stroke="#0369a1" stroke-width="2" stroke-linejoin="round"/>
  <path d="M180 176 C198 168 210 176 218 166" fill="none" stroke="#e0f2fe" stroke-width="1.8" stroke-linecap="round" opacity=".7"/>

  <!-- Dorsal fin -->
  <path d="M118 92 C112 56 136 44 146 78 C138 70 128 78 122 92 Z" fill="url(#aq-fin)" stroke="#0369a1" stroke-width="2" stroke-linejoin="round"/>

  <!-- Back fin-ear -->
  <path d="M148 88 C168 60 186 78 176 108 C168 96 156 96 148 100 Z" fill="url(#aq-fin)" stroke="#0369a1" stroke-width="2" stroke-linejoin="round"/>

  <!-- Body -->
  <ellipse cx="120" cy="160" rx="54" ry="46" fill="url(#aq-body)" stroke="#0369a1" stroke-width="2.4"/>
  <ellipse cx="116" cy="170" rx="33" ry="26" fill="url(#aq-belly)"/>

  <!-- Head -->
  <ellipse cx="114" cy="110" rx="48" ry="42" fill="url(#aq-body)" stroke="#0369a1" stroke-width="2.4"/>

  <!-- Front fin-ear -->
  <path d="M84 86 C62 56 44 78 60 108 C68 94 78 94 88 100 Z" fill="url(#aq-fin)" stroke="#0369a1" stroke-width="2" stroke-linejoin="round"/>
  <path d="M74 80 C66 70 58 80 64 92" fill="none" stroke="#e0f2fe" stroke-width="1.5" opacity=".7"/>

  <!-- Side fin -->
  <path d="M78 168 C52 172 48 196 72 192 C64 184 78 178 86 176 Z" fill="url(#aq-fin)" stroke="#0369a1" stroke-width="2" stroke-linejoin="round"/>

  <!-- Face shine -->
  <ellipse cx="100" cy="100" rx="16" ry="10" fill="#e0f2fe" opacity=".35"/>

  <!-- Cheeks / gill blush -->
  <ellipse cx="80" cy="118" rx="10" ry="7" fill="#7dd3fc" opacity=".9"/>
  <ellipse cx="148" cy="116" rx="10" ry="7" fill="#7dd3fc" opacity=".9"/>
  <path d="M74 116 h10 M74 120 h8" stroke="#0284c7" stroke-width="1.1" stroke-linecap="round" opacity=".45"/>

  <!-- Eyes -->
  <ellipse cx="98" cy="108" rx="9" ry="11" fill="#0c2a3a"/>
  <ellipse cx="134" cy="106" rx="9" ry="11" fill="#0c2a3a"/>
  <ellipse cx="95" cy="104" rx="3.2" ry="4" fill="#fff"/>
  <ellipse cx="131" cy="102" rx="3.2" ry="4" fill="#fff"/>
  <ellipse cx="101" cy="112" rx="1.3" ry="1.5" fill="#7dd3fc" opacity=".8"/>

  <!-- Nose + smile -->
  <ellipse cx="116" cy="122" rx="5.2" ry="3.8" fill="#075985"/>
  <ellipse cx="115" cy="121" rx="1.6" ry="1.1" fill="#fff" opacity=".5"/>
  <path d="M106 130 Q116 138 126 130" fill="none" stroke="#0369a1" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Paws / flippers -->
  <ellipse cx="96" cy="200" rx="16" ry="10" fill="#38bdf8" stroke="#0369a1" stroke-width="2"/>
  <ellipse cx="140" cy="200" rx="16" ry="10" fill="#38bdf8" stroke="#0369a1" stroke-width="2"/>
  <path d="M88 198 q6 6 12 0" fill="none" stroke="#0369a1" stroke-width="1.15"/>
  <path d="M132 198 q6 6 12 0" fill="none" stroke="#0369a1" stroke-width="1.15"/>

  <!-- Bubbles -->
  <g fill="none" stroke="#bae6fd" stroke-width="2">
    <circle cx="42" cy="96" r="8" fill="#e0f2fe" fill-opacity=".35"/>
    <circle cx="58" cy="70" r="5" fill="#e0f2fe" fill-opacity=".4"/>
    <circle cx="214" cy="64" r="7" fill="#e0f2fe" fill-opacity=".35"/>
    <circle cx="226" cy="92" r="4" fill="#fff" fill-opacity=".5"/>
    <circle cx="36" cy="160" r="4.5" fill="#e0f2fe" fill-opacity=".4"/>
    <circle cx="208" cy="48" r="3" fill="#fff" fill-opacity=".7"/>
  </g>
  <path d="M48 92 q3 -4 0 -8" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" opacity=".7"/>
</svg>
